name: Actualizar foto ejecutiva v2

on:
  push:
    branches: [main]
    paths:
      - profile-webp.b64
      - .github/workflows/actualizar-foto-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear imagen WebP y actualizar CV
        shell: bash
        run: |
          base64 --decode profile-webp.b64 > profile.webp
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          avatar = 'https://avatars.githubusercontent.com/u/19506866?v=4'
          if avatar in html:
              html = html.replace(avatar, 'profile.webp')
          elif 'src="profile.jpg"' in html:
              html = html.replace('src="profile.jpg"', 'src="profile.webp"')
          elif 'src="profile.webp"' not in html:
              raise SystemExit('No se encontro la referencia actual de la foto en index.html')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar actualización
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html profile.webp
          git commit -m "Actualizar foto ejecutiva del CV [skip ci]"
          git push
